{% load static %}

<div class="modal answer-modal" id="answerCorrectModal" {% if my_answer.is_correct %}data-open-on-load="true"{% endif %}>
    <button class="answer-close closeModal" type="button">
        <img src="{% static 'quizzes/img/lobby/close.svg' %}" alt="Закрити">
    </button>

    <div class="answer-picture-box">
        <img class="answer-picture" src="{% static 'quizzes/img/modals/answer_correct.svg' %}" alt="">
        <span class="answer-badge">✓ Правильно</span>
    </div>

    <div class="answer-summary">
        <div class="answer-heading">
            <p class="answer-title">Правильно!</p>
            <p class="answer-points">+<span class="points-value">{{ my_points|default:0 }}</span> балів</p>
        </div>
        <p class="answer-subtitle">Чудово! Ви впоралися із запитанням.</p>
    </div>

    <div class="correct-answer">
        <p class="correct-label">Правильна відповідь</p>

        <div class="correct-locked">
            <p class="correct-text locked-text">Правильну відповідь буде відкрито пізніше</p>
            <img class="lock-icon" src="{% static 'quizzes/img/modals/lock.svg' %}" alt="Відповідь прихована">
        </div>
    </div>

    <div class="answer-wait">
        <p class="answer-wait-title">Очікуємо наступне запитання</p>
        <p class="answer-wait-hint">Ментор продовжить вікторину для всієї групи.</p>
    </div>
</div>
