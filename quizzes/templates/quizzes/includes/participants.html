{% load static %}

<div class="participants-box">
    <div class="general-data">
        <div class="participants-text">
            <p class="participants-title">{{ title|default:"Учасники" }}</p>
            <p class="info-box">Приєдналися до вікторини</p>
        </div>
        <span class="count-participants">{{ room.active_attempts|length }}</span>
    </div>

    <div class="participants-list" data-avatar="{% static 'quizzes/img/default-avatar.svg' %}" data-me-id="{{ user.profile_student.id }}">
        {% for person in room.active_attempts %}
            <div class="recipient">
                <img class="recipient-avatar" src="{% static 'quizzes/img/default-avatar.svg' %}" alt="">
                <p class="recipient-name">{{ person.student.user.full_name }}{% if person.student.user == user %} (ви){% endif %}</p>
                <div class="recipient-status">
                    <div class="status-circle"></div>
                    <span class="status-text">У кімнаті</span>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
